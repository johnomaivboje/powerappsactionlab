
name: export-and-branch-solution

on:
  workflow_dispatch:
    inputs:
      solution_name:
        description: 'Name of the solution to work on'
        required: true
        default: ALMLab

      solution_exported_folder:
        description: 'Folder for the exported solution'
        required: true
        default: out/exported/

      solution_folder:
        description: 'Folder for the unpacked solution'
        required: true
        default: out/solutions/

      solution_target_folder:
        description: 'Folder to check into source control'
        required: true
        default: solutions/

env:
  ENVIRONMENT_URL: 'https://org0e4a3e72.crm17.dynamics.com/'
  CLIENT_ID: 'fabe4f01-6997-4ed5-8fac-3fa5a7bf0733'
  TENANT_ID: '2a786448-4dc0-4299-878f-00e0c3f86d49'

permissions:
  contents: write

jobs:
  export-from-dev:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Who am I
        uses: microsoft/powerplatform-actions/who-am-i@v1
        with:
          environment-url: ${{ env.ENVIRONMENT_URL }}
          app-id: ${{ env.CLIENT_ID }}
          client-secret: ${{ secrets.PowerPlatformSPN }}
          tenant-id: ${{ env.TENANT_ID }}

      - name: Export solution
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ env.ENVIRONMENT_URL }}
          app-id: ${{ env.CLIENT_ID }}
          client-secret: ${{ secrets.PowerPlatformSPN }}
          tenant-id: ${{ env.TENANT_ID }}
          solution-name: ${{ inputs.solution_name }}
          solution-output-file: ${{ inputs.solution_exported_folder }}${{ inputs.solution_name }}.zip

      - name: Unpack solution
        uses: microsoft/powerplatform-actions/unpack-solution@v1
        with:
          solution-file: ${{ inputs.solution_exported_folder }}${{ inputs.solution_name }}.zip
          solution-folder: ${{ inputs.solution_folder }}${{ inputs.solution_name }}
          solution-type: Unmanaged
          overwrite-files: true

      - name: Branch solution
        uses: microsoft/powerplatform-actions/branch-solution@v1
        with:
          solution-folder: ${{ inputs.solution_folder }}${{ inputs.solution_name }}
          solution-target-folder: ${{ inputs.solution_target_folder }}${{ inputs.solution_name }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          allow-empty-commit: true
