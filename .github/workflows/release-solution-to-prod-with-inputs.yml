
name: release-solution-to-prod-reusable

on:
  workflow_call:
    inputs:
      solution_name:
        description: 'The solution name.'
        type: string
        required: true
        default: ALMLab

      solution_shipping_folder:
        description: 'Folder for the managed solution artifact.'
        type: string
        required: false
        default: out/ship

      solution_outbound_folder:
        description: 'Folder for the packaged solution.'
        type: string
        required: false
        default: out/solutions

      solution_source_folder:
        description: 'Folder containing the unpacked solution source.'
        type: string
        required: false
        default: solutions

      solution_release_folder:
        description: 'Folder for the downloaded release artifact.'
        type: string
        required: false
        default: out/release

      BUILD_ENVIRONMENT_URL:
        description: 'Build environment URL.'
        type: string
        required: true

      PRODUCTION_ENVIRONMENT_URL:
        description: 'Production environment URL.'
        type: string
        required: true

      BUILD_CLIENT_ID:
        description: 'Application client ID for the build environment.'
        type: string
        required: true

      PRODUCTION_CLIENT_ID:
        description: 'Application client ID for the production environment.'
        type: string
        required: true

      TENANT_ID:
        description: 'Microsoft Entra tenant ID.'
        type: string
        required: true

    secrets:
      buildSecret:
        description: 'Client secret for the build environment.'
        required: true

      prodSecret:
        description: 'Client secret for the production environment.'
        required: true

jobs:
  convert-to-managed:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Create output folders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path `
            "${{ inputs.solution_outbound_folder }}" | Out-Null
          New-Item -ItemType Directory -Force -Path `
            "${{ inputs.solution_shipping_folder }}" | Out-Null

      - name: Pack solution
        uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-folder: ${{ inputs.solution_source_folder }}/${{ inputs.solution_name }}
          solution-file: ${{ inputs.solution_outbound_folder }}/${{ inputs.solution_name }}.zip
          solution-type: Unmanaged

      - name: Import solution into build environment
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ inputs.BUILD_ENVIRONMENT_URL }}
          app-id: ${{ inputs.BUILD_CLIENT_ID }}
          client-secret: ${{ secrets.buildSecret }}
          tenant-id: ${{ inputs.TENANT_ID }}
          solution-file: ${{ inputs.solution_outbound_folder }}/${{ inputs.solution_name }}.zip
          force-overwrite: true
          publish-changes: true

      - name: Export managed solution
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ inputs.BUILD_ENVIRONMENT_URL }}
          app-id: ${{ inputs.BUILD_CLIENT_ID }}
          client-secret: ${{ secrets.buildSecret }}
          tenant-id: ${{ inputs.TENANT_ID }}
          solution-name: ${{ inputs.solution_name }}
          managed: true
          solution-output-file: ${{ inputs.solution_shipping_folder }}/${{ inputs.solution_name }}_managed.zip

      - name: Upload managed solution artifact
        uses: actions/upload-artifact@v4
        with:
          name: managedSolutions
          path: ${{ inputs.solution_shipping_folder }}/${{ inputs.solution_name }}_managed.zip
          if-no-files-found: error

  release-to-production:
    needs: convert-to-managed
    runs-on: windows-latest

    steps:
      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Create release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path `
            "${{ inputs.solution_release_folder }}" | Out-Null

      - name: Download managed solution artifact
        uses: actions/download-artifact@v4
        with:
          name: managedSolutions
          path: ${{ inputs.solution_release_folder }}

      - name: Import solution into production
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ inputs.PRODUCTION_ENVIRONMENT_URL }}
          app-id: ${{ inputs.PRODUCTION_CLIENT_ID }}
          client-secret: ${{ secrets.prodSecret }}
          tenant-id: ${{ inputs.TENANT_ID }}
          solution-file: ${{ inputs.solution_release_folder }}/${{ inputs.solution_name }}_managed.zip
          force-overwrite: true
          publish-changes: true
